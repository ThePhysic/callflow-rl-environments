[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "callflow-rl"
version = "0.1.0"
description = "Deterministic conversational appointment RL with independently verified outcomes"
requires-python = ">=3.12"
dependencies = ["numpy>=2.1,<3", "gymnasium>=1.0,<2", "torch>=2.6,<3", "pyarrow>=19,<24", "matplotlib>=3.9,<4", "pyyaml>=6,<7"]

[dependency-groups]
dev = ["pytest>=8,<10", "hypothesis>=6,<7", "ruff>=0.11,<1", "mypy>=1.15,<2", "types-PyYAML>=6"]

[project.scripts]
callflow = "callflow_rl.cli:main"

# PyPI already supplies CPU wheels on Windows/macOS. Avoid CUDA runtime
# downloads on Linux too; this project trains and evaluates on CPU.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/callflow_rl"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/callflow_rl"]
follow_imports = "skip"

[[tool.mypy.overrides]]
module = ["torch.*", "gymnasium.*", "numpy.*", "matplotlib.*", "pyarrow.*"]
follow_imports = "skip"
